[project]
name = "backend"
version = "0.1.0"
description = "Web API con FastAPI que implementa un caso de uso de JWT"
authors = [
    { name = "jbenitez-baufest" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.130.0",
    "uvicorn>=0.30.0,<1.0.0",
    "pyjwt>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
