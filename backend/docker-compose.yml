services:
  api:
    build: .
    container_name: jwt-auth-api
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7}
      ACCESS_TOKEN_EXPIRE_SECONDS: ${ACCESS_TOKEN_EXPIRE_SECONDS:-300}
    restart: unless-stopped
